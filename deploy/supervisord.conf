; value-rail 24/7 supervision on the box (no systemd/cron available - see docs/deployment.md).
; Start:   deploy/vrctl start      (idempotent; launches supervisord detached via setsid)
; Status:  deploy/vrctl status
; All paths are relative to the repo root (%(here)s/..).

[unix_http_server]
file=%(here)s/../data/run/supervisor.sock
chmod=0700

[supervisord]
logfile=%(here)s/../data/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=5
loglevel=info
pidfile=%(here)s/../data/run/supervisord.pid
directory=%(here)s/..
nodaemon=false
minfds=1024
minprocs=200
umask=077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../data/run/supervisor.sock

; Scheduler worker: DB lease (only one active scheduler), heartbeat file, bounded catch-up.
; Settings (DB path, config, Basic-auth credentials) come from ../.env (chmod 600) via pydantic-settings.
[program:worker]
command=%(here)s/../.venv/bin/value-rail worker
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=10
startretries=1000
stopsignal=TERM
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=%(here)s/../data/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
environment=PYTHONUNBUFFERED="1"

; Mobile web UI, loopback only, Basic auth enabled through .env.
[program:web]
command=%(here)s/../.venv/bin/value-rail serve --host 127.0.0.1 --port 8000
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=%(here)s/../data/logs/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
environment=PYTHONUNBUFFERED="1"
