name: CoinGate Clearance signal feed
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [master, fix/review-valuation-worker-health, clearance-signals]
    paths:
      - '.github/workflows/clearance-feed.yml'
      - 'src/value_rail/clearance_feed.py'
      - 'src/value_rail/connectors/coingate_clearance.py'
      - 'scripts/export_clearance_feed.py'
      - 'config/production.toml'
      - 'chatgpt-delivery.json'
permissions:
  contents: write
concurrency:
  group: clearance-signal-feed
  cancel-in-progress: false
jobs:
  export:
    # Delivery acknowledgements must not start scans or create a feedback loop.
    if: github.ref != 'refs/heads/clearance-signals' || github.event.head_commit.message == 'Request CoinGate Clearance refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The data branch carries the trigger, but scanner code comes from master.
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - name: Read previous signal state
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const r = await github.rest.repos.getContent({...context.repo, path:'clearance.json', ref:'clearance-signals'});
              fs.writeFileSync('/tmp/previous-clearance.json', Buffer.from(r.data.content,'base64'));
            } catch (e) {
              if (e.status !== 404) throw e;
            }
      - name: Read only CoinGate Clearance
        run: python scripts/export_clearance_feed.py --previous /tmp/previous-clearance.json --output /tmp/clearance.json
      - name: Publish readable signal feed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'clearance-signals';
            try { await github.rest.git.getRef({...context.repo, ref:'heads/'+branch}); }
            catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.git.createRef({...context.repo, ref:'refs/heads/'+branch, sha:context.sha});
            }
            let sha;
            try {
              const r = await github.rest.repos.getContent({...context.repo, path:'clearance.json', ref:branch});
              sha = r.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            const report = JSON.parse(fs.readFileSync('/tmp/clearance.json','utf8'));
            await github.rest.repos.createOrUpdateFileContents({...context.repo, path:'clearance.json', branch,
              ...(sha ? {sha} : {}), message:'Update CoinGate Clearance public signal feed',
              content:fs.readFileSync('/tmp/clearance.json').toString('base64')});
            if (report.status !== 'ok') core.setFailed('Clearance source check failed: '+report.error_code);
