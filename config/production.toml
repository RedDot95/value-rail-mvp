# Einzige Angebotsquelle: https://coingate.com/gift-cards/clearance
[display]
timezone = "Europe/Berlin"

[rules]
evaluation_mode = "screener"
label = "coingate-clearance-2026-10-10-v1"
price_find_min_discount = "0.01"
max_offer_age_seconds = 900

[alerts]
sink = "log,telegram"
alert_statuses = ["price_find"]
material_price_change_pct = "0.02"
restock_min_increase = 1
max_attempts = 5
retry_backoff_seconds = 60
log_file = "data/alerts.log"

[scan_intervals]
watchlist_seconds = 300
new_sellers_seconds = 300
aggregator_seconds = 300
stale_after_seconds = 900

[[connectors]]
key = "coingate"
kind = "coingate_clearance"
enabled = true
notes = "Ausschließlich CoinGate Clearance; keine normalen Produktangebote."

[scheduler]
tick_seconds = 15
lock_ttl_seconds = 900
max_catchup_runs = 1
heartbeat_file = "data/heartbeat.json"
stale_factor = 3

[[jobs]]
name = "coingate_clearance"
connector = "coingate"
interval_seconds = 300
min_interval_seconds = 300
enabled = true

[[jobs]]
name = "backup_daily"
kind = "backup"
interval_seconds = 86400
min_interval_seconds = 3600
enabled = true

[scope]
enabled = true
allowed_source_keys = ["coingate"]
