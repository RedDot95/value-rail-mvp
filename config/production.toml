# Liquid-value screener: beobachtete Angebote, Rabatt-Signale und Push.
# Keine Gebühren-, Auszahlungs- oder Kontoprüfung im Screener.

[display]
timezone = "Europe/Berlin"

# Rule parameters are VERSIONED: on `init-db`/`rules seed` a RuleVersion row is created
# whenever these parameters differ from the latest stored version. Old evaluations keep
# referencing the RuleVersion they were computed with (exact replay).
# A new RuleVersion row is created on init-db when no stored version carries this label.
[rules]
evaluation_mode = "screener"
label = "liquid-screener-2026-10-08-v1"
price_find_min_discount = "0.01"     # Signal ab 1 % beobachtetem Rabatt; frei einstellbar
max_offer_age_seconds = 3600         # offer snapshot freshness

[alerts]
sink = "log,telegram"                # "log" or "log,telegram" (telegram needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID)
alert_statuses = ["price_find"]      # Konkrete Angebote unter Nennwert; Auszahlung manuell
material_price_change_pct = "0.02"   # >= 2 % Änderung des beobachteten Preises -> neues Ereignis
restock_min_increase = 1             # quantity 0/unknown -> >0, or +N units -> new event
max_attempts = 5
retry_backoff_seconds = 60
log_file = "data/alerts.log"         # structured JSON lines (in addition to stderr)

# Scan intervals from the Bauauftrag (informational; the scheduler uses [[jobs]] below).
[scan_intervals]
watchlist_seconds = 300          # Watchlist: 5 min
new_sellers_seconds = 1800       # neue Seller: 30 min
aggregator_seconds = 1800       # weitere Quellen: alle 30 Minuten
stale_after_seconds = 900        # data older than this is displayed as "veraltet"

# =====================================================================================================
# PRODUCTION (24/7 on the box) - live connectors. Used via VALUE_RAIL_CONFIG_PATH=config/production.toml
# (set in .env). Source access basis + blocked sources: docs/sources.md (checked 2026-10-06).
# Politeness: every connector >= 5 s per host + 0-2 s jitter, robots.txt + Crawl-delay honoured,
# one shared client per connector (watch + sweep jobs share it).
# =====================================================================================================

[[connectors]]
key = "fixture"
kind = "fixture"
enabled = false
notes = "SYNTHETIC offline fixtures - disabled in production"

[[connectors]]
key = "recharge"
kind = "recharge"
enabled = true
notes = "Recharge.com DE (direct seller) - Bitsa, paysafecard, Crypto Voucher; JSON-LD ProductGroup."
[connectors.options]
storefront = "en/de"
region = "DE"
min_interval_s = 5.0
jitter_s = 2.0
products = [
  { slug = "bitsa", family = "bitsa", redemption_program = "bitsa", prerequisites = ["bitsa_account_kyc_eea"], tier = "watch" },
  { slug = "paysafecard", family = "paysafecard", redemption_program = "paysafecard", prerequisites = ["paysafecard_refund_identity_verification_de_bank_account"], tier = "watch" },
  # Crypto Voucher (cryptovoucher.io): asset chosen at redemption (BTC and others) -> NOT an unambiguous asset.
  { slug = "crypto-voucher", family = "crypto_voucher", redemption_program = "cryptovoucher", prerequisites = ["cryptovoucher_account_kyc"], tier = "watch" },
]

[[connectors]]
key = "dundle"
kind = "jsonld_shop"
enabled = false   # DISABLED 2026-10-07 10:10 CEST by watchdog: blocked continuously >6h (HTTP 403 bot protection / HTTP 429 rate limit since 03:48:02 CEST); not bypassed
notes = "dundle.com DE (direct seller, Korsit B.V.) - Product.offers JSON-LD per denomination; service fee only in cart."
[connectors.options]
source_key = "dundle-com-de"
source_name = "dundle.com (DE storefront, JSON-LD)"
host = "dundle.com"
source_kind = "direct_seller"
fixed_seller = "dundle.com"
fee_name = "service_fee"
fee_note = "dundle FAQ: Servicegebuehr beim Kauf, Hoehe nur im Warenkorb (nicht geoeffnet) -> unknown"
min_interval_s = 5.0
jitter_s = 2.0
pages = [
  { path = "/de/paysafecard/", family = "paysafecard", redemption_program = "paysafecard", region = "DE", tier = "watch", prerequisites = ["paysafecard_refund_identity_verification_de_bank_account"] },
  { path = "/de/bitsa/", family = "bitsa", redemption_program = "bitsa", region = "DE", tier = "watch", prerequisites = ["bitsa_account_kyc_eea"] },
  # Azteco (BTC on-chain): page exists but currently lists no Product offers -> absent_ok (0 offers, no error)
  { path = "/de/azteco/", family = "crypto_voucher", redemption_program = "azteco-btc", region = "DE", tier = "discover", absent_ok = true, note = "Azteco BTC - unambiguous asset (Bitcoin on-chain)" },
]

[[connectors]]
key = "gamivo"
kind = "jsonld_shop"
enabled = false   # BLOCKED live: Cloudflare managed challenge (403, cf-mitigated: challenge) for the worker client; not bypassed
notes = "GAMIVO marketplace - parser ready (Product.offers JSON-LD with seller.name), offline-tested; live blocked by Cloudflare challenge for our HTTP/1.1 client (see docs/sources.md). No paysafecard/Bitsa/Azteco listing found."
[connectors.options]
source_key = "gamivo-com"
source_name = "GAMIVO (marketplace, JSON-LD seller offers)"
host = "www.gamivo.com"
source_kind = "marketplace"
fee_name = "checkout_fees"
fee_note = "GAMIVO: service/payment fees only shown in checkout (not opened) -> unknown"
min_interval_s = 6.0
jitter_s = 2.0
pages = [
  { path = "/product/flexepin-eur-50", family = "flexepin", redemption_program = "flexepin", region = "EU", tier = "watch" },
  { path = "/product/flexepin-eur-100", family = "flexepin", redemption_program = "flexepin", region = "EU", tier = "watch" },
  { path = "/product/neosurf-gift-card-15-eu-eur-prepaid-eu-standard-15eur-gift-cards", family = "neosurf", redemption_program = "neosurf", region = "EU", tier = "discover" },
  { path = "/product/jetoncash-card-eur-eu-gift-cards-prepaid-eu-standard-50eur", family = "jetoncash", redemption_program = "jetoncash", region = "EU", tier = "discover" },
]

# ---------------------------------------------------------------------------------------------------------
# Aggregator / comparison sources: concrete priced denominations can trigger screener signals.
# Percentage-only summaries cannot. Access basis: docs/sources.md section 0b.
[[connectors]]
key = "coingate"
kind = "coingate_mcp"
enabled = true
notes = "aggregator/discovery_only: official no-auth CoinGate Gift Cards MCP server, read-only tools only (search_gift_cards, get_gift_card). CoinGate itself is the seller."
[connectors.options]
source_key = "coingate"
source_name = "CoinGate Gift Cards (MCP, discovery)"
host = "giftcards-api.coingate.com"
endpoint_path = "/api/mcp"
max_search_pages = 4
max_discovered_brand_details = 12
min_interval_s = 6.0
jitter_s = 2.0
brands = [
  { brand = "bitsa", country = "DE", family = "bitsa", redemption_program = "bitsa", region = "DE" },
  { brand = "paysafecard", country = "DE", family = "paysafecard", redemption_program = "paysafecard", region = "DE" },
  { brand = "flexepin", country = "DE", family = "flexepin", redemption_program = "flexepin", region = "DE" },
  { brand = "cashlib", country = "DE", family = "cashlib", redemption_program = "cashlib", region = "DE" },
]
searches = [
  { category = "clearance-stock", country = "DE", empty_ok = true, family = "clearance", region = "DE", note = "Clearance-Liste (Web: /gift-cards/clearance?country=DE)" },
  { category = "clearance-stock", country = "WW", empty_ok = true, family = "clearance", region = "WW", note = "Clearance-Liste (Web: /gift-cards/clearance?country=WW)" },
  { category = "payment-cards", country = "DE", family = "payment-cards", region = "DE" },
]

