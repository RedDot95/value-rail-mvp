[scheduler]
tick_seconds = 15
lock_ttl_seconds = 900
max_catchup_runs = 1
heartbeat_file = "data/live/heartbeat.json"
stale_factor = 3

# Watchlist alle 5 Minuten; weitere Quellen alle 30 Minuten.
[[jobs]]
name = "recharge_watch"
connector = "recharge"
interval_seconds = 300
min_interval_seconds = 300
options = { tiers = ["watch"] }
enabled = true

