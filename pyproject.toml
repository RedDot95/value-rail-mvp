[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "value-rail-mvp"
version = "0.1.0"
description = "Evidence-based research for profitable liquid voucher and balance routes"
readme = "README.md"
requires-python = ">=3.12"
# Versions pinned 2026-10-05 against the current PyPI releases (resolved with uv).
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.3",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "jinja2==3.1.6",
    "typer==0.27.2",
    "python-multipart==0.0.32",
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",  # Starlette 1.x TestClient backend (plain httpx is deprecated there)
]
ops = [
    "supervisor==4.3.0",  # process supervision on hosts without systemd (deploy/supervisord.conf)
]

[project.scripts]
value-rail = "value_rail.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
value_rail = ["web/templates/*.html", "web/static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: hits the real network (excluded by default; run with `pytest -m live` or `value-rail smoke <connector>`)"]
filterwarnings = ["error::DeprecationWarning:value_rail.*"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["src"]
