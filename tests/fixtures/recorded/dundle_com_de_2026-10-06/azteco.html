<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Wie lange sind Azteco Lightning Vouchers gültig?","acceptedAnswer":{"@type":"Answer","text":"Azteco Lightning Vouchers sind ab Kaufdatum 30 Tage lang gültig. Bei Verlust, Diebstahl oder Ablauf der Gültigkeit können sie nicht ersetzt oder erstattet werden. Es gelten die AGB von Azteco."}},{"@type":"Question","name":"Gibt es Einschränkungen bei der Nutzung von Azteco Vouchern?","acceptedAnswer":{"@type":"Answer","text":"Du musst mindestens 13 Jahre alt sein, um Azteco-Gutscheine nutzen zu können. \n\nMinderjährige benötigen die Zustimmung eines Elternteils oder Erziehungsberechtigten, um die Dienste zu nutzen.\n\nBei Verlust, Diebstahl oder Verfall können die Voucher nicht ersetzt werden. \n\nAzteco-Gutscheine können nicht erstattet, zurückgegeben oder in Bargeld umgetauscht werden. \n\nDu kannst Azteco Voucher nicht wieder aufladen.\n\n\nWeitere rechtliche Informationen findest du in den AGB von Azteco."}},{"@type":"Question","name":"Was ist der Unterschied zwischen On-Chain und Lightning Azteco Vouchers?","acceptedAnswer":{"@type":"Answer","text":"Azteco Lightning Vouchers:\nVerwende das Bitcoin Lightning Network, um Bitcoin zu übertragen.\n\nTransaktionen werden in wenigen Sekunden abgeschlossen.\n\nDie Bearbeitungsgebühren für das Netzwerk betragen in der Regel weniger als ein paar Cent.\n\n\nAzteco On-Chain Vouchers:\nVerwende das Haupt-Bitcoin-Netzwerk, um Bitcoin zu übertragen.\n\nTransaktionen können mehrere Minuten in Anspruch nehmen.\n\nDie Bearbeitungsgebühren im Netzwerk können Kosten mit sich bringen.\n\n\n\nHinweis: Bevor du einen dieser Azteco-Gutscheine kaufst, empfehlen wir dir, im Voraus zu prüfen, ob dein Wallet On-Chain- und/oder Lightning-Transaktionen unterstützt."}},{"@type":"Question","name":"Muss ich ein Azteco-Konto erstellen, um einen Azteco Voucher einlösen zu können?","acceptedAnswer":{"@type":"Answer","text":"Nein. Du musst kein Azteco-Konto erstellen oder verifizieren, um Azteco-Gutscheine zu kaufen oder einzulösen."}},{"@type":"Question","name":"Wie löse ich einen Azteco Lightning Voucher ein?","acceptedAnswer":{"@type":"Answer","text":"Besuche azte.co und wähle „Redeem“ (dt. Einlösen).\n\nGib den 16-stelligen Code von deinem Azteco-Gutschein ein, um einen QR-Code zu erhalten.\n\nScanne den QR-Code mit einer Lightning Wallet App, um deine Bitcoin zu erhalten."}},{"@type":"Question","name":"Wie löse ich einen Azteco On-Chain Voucher ein?","acceptedAnswer":{"@type":"Answer","text":"Besuche azte.co und wähle „Redeem“ (dt. Einlösen).\n\nGib den 16-stelligen Code von deinem Azteco-Gutschein ein.\n\nGib deine Bitcoin-Adresse ein, um deine Bitcoin zu erhalten."}},{"@type":"Question","name":"Wie wird der Bitcoin-Wert des Gutscheins berechnet?","acceptedAnswer":{"@type":"Answer","text":"Der Bitcoin-Wert des Gutscheins wird anhand des Marktpreises von Bitcoin zum Zeitpunkt des Kaufs berechnet. Azteco-Gutscheine, die bei dundle gekauft werden, enthalten eine Provision von 10 %. On-chain-Gutscheine enthalten auch eine „Netzwerkgebühr“, um die Kosten für die Verarbeitung deines Gutscheins über das Haupt-Bitcoin-Netzwerk zu decken."}},{"@type":"Question","name":"Wie kontaktiere ich den Azteco-Gutschein-Kundendienst?","acceptedAnswer":{"@type":"Answer","text":"Wenn du noch Fragen hast oder Hilfe mit deinem Azteco Voucher brauchst, dann kannst du mehr Informationen auf der Azteco-Supportseite finden."}}]}</script>
